<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Death Line｜像素跑酷</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="480" height="270"></canvas>

    <div id="nameOverlay" class="hidden">
      <div class="name-panel">
        <h2 id="nameTitle">留下你的名字</h2>
        <p id="nameHint">最多 8 個字元，空白則為「無名騎士」</p>
        <input id="nameInput" type="text" maxlength="8" autocomplete="off" spellcheck="false" placeholder="無名騎士">
        <button id="nameSubmit" type="button">確認</button>
      </div>
    </div>
  </div>

  <script>
    // Firebase 全球排行榜：模組載入完成後才會 resolve。
    // 直接以 file:// 開啟時跳過模組，自動使用本機排行榜。
    window.DLRemoteReady = new Promise(resolve => {
      window.__resolveDLRemote = resolve;
      setTimeout(() => resolve(window.DLRemote || null), 4000);
    });

    if (location.protocol === 'file:') {
      window.__resolveDLRemote(null);
    } else {
      const firebaseScript = document.createElement('script');
      firebaseScript.type = 'module';
      firebaseScript.src = 'firebase.js';
      document.head.appendChild(firebaseScript);
    }
  </script>
  <script src="game.js?v=20261113"></script>
</body>
</html>
